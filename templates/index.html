<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloud Deployment Lab</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f3f6fb;
        color: #182338;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 1px solid #dce4f0;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 3rem rgb(24 35 56 / 8%);
      }

      h1 {
        margin-top: 0;
        color: #1456c0;
      }

      .version {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: #eaf1ff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to the Cloud Deployment Lab</h1>
      <p>Application owner: <strong>{{ app_name }}</strong></p>
      <p>Application version: <span class="version">{{ app_version }}</span></p>
    </main>
  </body>
</html>
